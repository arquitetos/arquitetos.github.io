<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 1) Troque o nome que aparece na aba do navegador -->
<title>Sistema de Projetos</title>
<meta name="theme-color" content="#0b3d5c">
<!-- Ícone da aba: quadrado petróleo com a sigla (troque "SP" se quiser) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b3d5c'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%235ce1f2'%3ESP%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #f3f5f8; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .carregando { position: fixed; inset: 0; display: grid; place-items: center; font: 600 14px system-ui, sans-serif; color: #6b7a88; }
</style>
</head>
<body>
  <div class="carregando">Carregando...</div>
  <!-- URL /exec do Apps Script (se um dia mudar, troque aqui) -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbwdAzQ2pRWLG29d4dmq76jiynTmYoWHXVB500KwZW4d0piL_R0aiCB55YhCDw1jwJk-/exec"
    title="Sistema de Projetos"
    allow="clipboard-read; clipboard-write; fullscreen"
    onload="document.querySelector('.carregando').remove()"></iframe>
</body>
</html>
